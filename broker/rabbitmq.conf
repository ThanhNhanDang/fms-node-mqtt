# Cau hinh rieng cua PCM. Nam trong conf.d/ nen khong de len file goc.

# --- MQTT ---------------------------------------------------------------
# Node ESP32 noi MQTT 3.1.1. RabbitMQ dich topic sang routing key AMQP
# (dau '/' thanh '.'), nen 'fms/68EE.../meas' toi consumer AMQP duoi dang
# 'fms.68EE....meas' tren exchange amq.topic.
mqtt.listeners.tcp.default = 1883

# Giai doan 1: chua co chung danh tung thiet bi, dung user mac dinh de
# chung minh duong di. Giai doan sau bat lai va cap user cho tung node.
mqtt.allow_anonymous = false
mqtt.vhost = /pcm
mqtt.exchange = amq.topic

# Phien ben bi: node mat song roi vao lai van nhan duoc lenh da xep hang.
# Day la thu HTTP khong lam duoc, va la ly do chinh doi sang MQTT.
mqtt.max_session_expiry_interval_seconds = 3600

# --- chung ---------------------------------------------------------------
# May edge 7,8 GB va con nuoi edge_collector + mysql; chan RabbitMQ lai
# truoc khi no an het. Vuot nguong thi broker chan publisher lai, khong
# phai sap may.
vm_memory_high_watermark.absolute = 768MB
disk_free_limit.absolute = 2GB
